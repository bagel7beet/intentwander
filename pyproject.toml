[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bagel7beet-intentwander"
version = "0.1.0"
description = "按段落统计提示词的意图漂移相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bagel7beet" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bagel7beet.github.io"
Repository = "https://github.com/bagel7beet/intentwander"
Issues = "https://github.com/bagel7beet/intentwander/issues"

[project.scripts]
intentwander = "intentwander:main"

[tool.setuptools]
py-modules = ["intentwander"]
